name: NexDesk Enterprise CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Test & Package Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile Application
        run: mvn -B compile -f backend/pom.xml

      - name: Execute Unit & Integration Tests
        run: mvn -B test -f backend/pom.xml

      - name: Package Executable Spring Boot JAR
        run: mvn -B package -DskipTests -f backend/pom.xml

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexdesk-backend-jar
          path: backend/target/nexdesk-backend-*.jar
          retention-days: 7

  docker-build:
    name: Docker Container Build Check
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: nexdesk/backend:latest
