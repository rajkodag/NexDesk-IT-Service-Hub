<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="4"/>
  
  <!-- Outer Tech Shield Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#logoGrad)" stroke-width="8" stroke-dasharray="16 12" opacity="0.6"/>
  
  <!-- Glowing Center 'N' Logo -->
  <g filter="url(#glow)">
    <path d="M 170 360 L 170 152 L 220 152 L 292 278 L 292 152 L 342 152 L 342 360 L 292 360 L 220 234 L 220 360 Z" fill="url(#logoGrad)" />
  </g>
  
  <!-- Pulse Dot -->
  <circle cx="342" cy="152" r="16" fill="#10b981"/>
</svg>
