<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NexDesk IT Service Hub</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="container"><div class="brand">NEXDESK</div><h1>IT Service Hub</h1><p class="muted">IT support management in one place.</p><div id="message"></div><section id="auth"><div class="tabs"><button id="loginTab" class="active">Login</button><button id="signupTab">Create Account</button></div><form id="loginForm" class="card"><h2>Login</h2><input id="loginEmail" type="email" placeholder="Email" required><input id="loginPassword" type="password" placeholder="Password" required><button>Login</button><p class="hint">Demo: demo@nexdesk.com / demo123</p></form><form id="signupForm" class="card hidden"><h2>Create Account</h2><input id="signupName" placeholder="Full name" required><input id="signupEmail" type="email" placeholder="Email" required><input id="signupPassword" type="password" minlength="4" placeholder="Password" required><button>Create Account</button></form></section><section id="app" class="hidden"><div class="topbar"><strong id="welcome"></strong><button id="logout" class="secondary">Logout</button></div><div id="userPanel"><div class="card"><h2>Create Ticket</h2><form id="ticketForm"><input id="title" placeholder="Ticket title" required><textarea id="description" placeholder="Describe your problem" required></textarea><select id="category"><option>Hardware</option><option>Software</option><option>Network</option><option>Access</option><option>General</option></select><select id="priority"><option>LOW</option><option selected>MEDIUM</option><option>HIGH</option><option>CRITICAL</option></select><button>Create Ticket</button></form></div><div class="card"><h2>My Tickets</h2><div id="myTickets"></div></div></div><div id="adminPanel" class="hidden"><div class="card"><h2>All Tickets</h2><div id="adminTickets"></div></div><div class="card"><h2>Technicians</h2><div id="technicians"></div></div></div></section></main><script src="/js/auth.js"></script></body></html>
