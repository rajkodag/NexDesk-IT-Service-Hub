# NexDesk Enterprise Configuration
spring.application.name=nexdesk-backend
server.port=8080

# Oracle Database Configuration
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
spring.datasource.username=${DB_USER:ITHELPDESK}
spring.datasource.password=${DB_PASSWORD:ithelpdesk123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Hibernate & JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Static Frontend Resource Locations (allows direct hot reload of frontend assets)
spring.web.resources.static-locations=classpath:/static/,file:../frontend/,file:frontend/

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
